<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data-Bound Standalone Example</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f3f4f6;
    }
    #app {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    #app > ui-card {
      display: block;
      margin-bottom: 1.5rem;
    }
    #app > ui-card:last-child { margin-bottom: 0; }
    .option-consumer-list {
      list-style: none;
      margin: 1rem 0 0;
      padding: 0;
    }
    .option-consumer-item {
      padding: 0.5rem 0.75rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.375rem;
      margin-bottom: 0.375rem;
      background: #f9fafb;
    }
    .error-message {
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 0.5rem;
      padding: 1.5rem;
      color: #991b1b;
    }
    .error-message h2 { margin: 0 0 0.5rem; font-size: 1.25rem; }
    .error-message p { margin: 0; white-space: pre-line; }
  </style>
</head>

<body>
  <main id="app"></main>
  <script type="module" src="./data-bound-main.ts"></script>
</body>

</html>
