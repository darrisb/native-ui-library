<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Button Verification</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f3f4f6;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 720px;
      margin: 0 auto;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .status {
      padding: 0.75rem 1rem;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 0.375rem;
      min-height: 1.5rem;
    }
  </style>
</head>

<body>
  <div class="stack">
    <div class="row">
      <ui-button id="default-button"></ui-button>
    </div>

    <div class="row">
      <ui-button label="Primary" variant="primary"></ui-button>
      <ui-button label="Secondary" variant="secondary"></ui-button>
      <ui-button label="Ghost" variant="ghost"></ui-button>
    </div>

    <div class="row">
      <ui-button id="dynamic-button" label="This label will update"></ui-button>
    </div>

    <div class="row">
      <ui-button label="Disabled" disabled></ui-button>
    </div>

    <div class="row">
      <ui-button id="clickable-button" label="Click me"></ui-button>
      <ui-button id="keyboard-button" label="Activate with Enter or Space"></ui-button>
    </div>

    <div class="row">
      <ui-button label="First independent button" id="first"></ui-button>
      <ui-button label="Second independent button" id="second" variant="secondary"></ui-button>
    </div>

    <div class="status" id="status" aria-live="polite">
      Button clicks: 0
    </div>
  </div>

  <script type="module">
    import "../../packages/components/dist/register.js";

    let clickCount = 0;
    const status = document.getElementById("status");

    function recordActivation(source) {
      clickCount += 1;
      status.textContent = `Button clicks: ${clickCount} (last: ${source})`;
    }

    document.getElementById("clickable-button")?.addEventListener("click", () => {
      recordActivation("mouse/click");
    });

    document.getElementById("keyboard-button")?.addEventListener("click", () => {
      recordActivation("keyboard");
    });

    document.getElementById("first")?.addEventListener("click", () => {
      recordActivation("first independent");
    });

    document.getElementById("second")?.addEventListener("click", () => {
      recordActivation("second independent");
    });

    setTimeout(() => {
      const dynamic = document.getElementById("dynamic-button");
      if (dynamic) {
        dynamic.setAttribute("label", "The label was updated after initial rendering.");
        dynamic.setAttribute("variant", "ghost");
      }
    }, 3000);
  </script>
</body>

</html>
