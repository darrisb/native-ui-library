<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Text Verification</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f3f4f6;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 720px;
      margin: 0 auto;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    ui-text {
      font-size: 1rem;
    }

    ui-text.block {
      display: block;
    }
  </style>
</head>

<body>
  <div class="stack">
    <div class="row">
      <ui-text content="Default text"></ui-text>
    </div>

    <div class="row">
      <ui-text content="Centered text" align="center" class="block"></ui-text>
    </div>

    <div class="row">
      <ui-text content="Right-aligned text" align="right" class="block"></ui-text>
    </div>

    <div class="row">
      <ui-text content="Colored text" color="#2563eb"></ui-text>
    </div>

    <div class="row">
      <ui-text content="Styled text" color="#dc2626" align="center" class="block"></ui-text>
    </div>

    <div class="row">
      <ui-text id="literal-text"
        content="&lt;script&gt;alert('this is literal text')&lt;/script&gt;"></ui-text>
    </div>

    <div class="row">
      <ui-text id="updating-text" content="This text will update after three seconds." class="block"></ui-text>
    </div>
  </div>

  <script type="module">
    import "../../packages/components/dist/register.js";

    setTimeout(() => {
      const text = document.getElementById("updating-text");
      if (text) {
        text.setAttribute("content", "The text content was updated after initial rendering.");
        text.setAttribute("color", "#059669");
        text.setAttribute("align", "right");
      }
    }, 3000);
  </script>
</body>

</html>
